spring.application.name=assistant
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:h2:mem:research_assistant
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true

# Spring AI Gemini Configuration
spring.ai.vertex.ai.gemini.api-key=api-key
spring.ai.vertex.ai.gemini.project-id=placeholder-id
spring.ai.vertex.ai.gemini.location=us-central1

# Or if using google-genai
spring.ai.google.genai.api-key=api-key
spring.ai.gemini.model=gemini-3.8-flash

# File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Local storage path
app.local-storage.path=local-storage/pdfs